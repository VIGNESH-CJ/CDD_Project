<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart & Checkout – AI Foodie</title>
  <link rel="icon" href="/static/assets/aifoodie-mark.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css?v=20261118-visual-refresh">
</head>
<body class="bg-light">

  <!-- Navbar -->
  <nav class="navbar navbar-custom sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center gap-2" href="/">
        <img class="brand-logo" src="/static/assets/aifoodie-mark.svg" alt="" aria-hidden="true">
        <span class="brand-font fs-4 text-dark">AI <span class="brand-orange">Foodie</span></span>
      </a>
      <div class="d-flex align-items-center gap-3">
        <a href="/pages/restaurants.html" class="btn btn-outline-dark btn-sm"><i class="bi bi-plus-lg me-1"></i> Add More Items</a>
        <div id="navAuthContainer"></div>
      </div>
    </div>
  </nav>

  <div class="container py-5">
    <div class="row gy-4">
      <!-- Cart Items Section -->
      <div class="col-lg-7">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h4 class="fw-bold mb-0">Your Food Cart</h4>
          <button class="btn btn-outline-danger btn-sm" type="button" data-action="clear-cart">
            <i class="bi bi-trash me-1"></i> Clear Cart
          </button>
        </div>

        <div id="cartItemsList">
          <div class="text-center py-5">
            <div class="spinner-border text-warning" role="status"></div>
          </div>
        </div>
      </div>

      <!-- Order Summary & Checkout Card -->
      <div class="col-lg-5">
        <div id="cartSummaryContainer">
          <!-- Rendered dynamically by Cart.renderCartPage() -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js?v=20261119-datetime"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/cart.js"></script>
  <script src="/js/chatbot.js"></script>
  <script src="/js/websocket.js"></script>

</body>
</html>
